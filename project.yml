name: SwiftIPA
options:
  bundleIdPrefix: com.xsxs18
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
  OpenSSL:
    url: https://github.com/krzyzanowskim/OpenSSL.git
    from: 3.3.2000
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
targets:
  SwiftIPA:
    type: application
    platform: iOS
    sources:
      - path: SwiftIPA
      - path: Vendor/zsign/src
        optional: true
        excludes:
          - "**/zsign.cpp"
          - "**/archive.cpp"
          - "**/archive.h"
          - "**/certcheck.cpp"
          - "**/certcheck.h"
          - "**/metadata.cpp"
          - "**/metadata.h"
          - "third-party/**"
          - "**/common_win32.h"
    info:
      path: SwiftIPA/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.itunes.ipa
              - com.xsxs18.SwiftIPA.ipa
              - com.xsxs18.SwiftIPA.tipa
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.xsxs18.SwiftIPA.ipa
            UTTypeDescription: iOS App Archive
            UTTypeConformsTo: [public.data, public.content, com.apple.itunes.ipa]
            UTTypeTagSpecification:
              public.filename-extension: [ipa]
          - UTTypeIdentifier: com.xsxs18.SwiftIPA.tipa
            UTTypeDescription: iOS App Archive
            UTTypeConformsTo: [public.data, public.content, com.apple.itunes.ipa]
            UTTypeTagSpecification:
              public.filename-extension: [tipa]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleVersion: "0"
        CFBundleShortVersionString: "1.7.2"
        CFBundleLocalizations:
          - en
          - de
        NSLocalNetworkUsageDescription: "SwiftIPA runs a local server on your device so iOS can install the app you just signed."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.xsxs18.SwiftIPA
            CFBundleURLSchemes:
              - swiftipa
        UIBackgroundModes:
          - fetch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xsxs18.SwiftIPA
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: SwiftIPA/Signing/ZSign/SwiftIPA-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Vendor/zsign/src
          - $(SRCROOT)/Vendor/zsign/src/common
          - $(SRCROOT)/Vendor/openssl-include
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - SWIFTIPA_HAS_ZSIGN=1
    dependencies:
      - package: ZIPFoundation
      - package: OpenSSL
      - sdk: libz.tbd

schemes:
  SwiftIPA:
    build:
      targets:
        SwiftIPA: all
    run:
      config: Debug
